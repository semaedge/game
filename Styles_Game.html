<style>
  .game-page { width: var(--page); margin: 34px auto; }
  .game-page [hidden] { display: none !important; }
  .game-header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 22px; padding: 22px; border: 1px solid var(--line); border-radius: var(--radius); background: #0d1d18; }
  .game-header h2 { color: var(--ink); margin-bottom: 10px; font-size: clamp(2rem, 4vw, 3rem); }
  .game-header .muted { color: var(--muted); margin-bottom: 0; }
  .game-header > a { flex-shrink: 0; }
  .game-shell { display: grid; grid-template-columns: minmax(0, 1fr) 280px; align-items: start; gap: 18px; }
  .game-board { display: grid; place-items: center; min-width: 0; padding: clamp(10px, 2vw, 22px); border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(145deg, #10241d, #091712); box-shadow: var(--shadow); }
  .game-canvas-shell { position: relative; width: 100%; display: grid; place-items: center; }
  #gameCanvas { width: 100%; height: auto; max-height: 68vh; object-fit: contain; border-radius: 14px; background: #0b1914; }
  .game-asset-status { align-self: end; margin: 12px 0 0; color: var(--muted); font-size: .78rem; line-height: 1.5; text-align: center; }
  #gameCanvas:focus-visible { outline: 3px solid rgba(186,255,74,.45); outline-offset: 4px; }
  .game-canvas-status {
    width: 100%; margin: 8px 0 0; padding: 6px 10px;
    border: 1px solid rgba(255,255,255,.1); border-radius: 10px;
    color: #dce9e2; background: rgba(7,17,14,.82); font-size: .72rem;
    pointer-events: none; white-space: normal; text-align: center;
  }
  .game-canvas-shell:not([aria-busy="true"]) .game-canvas-status { opacity: 0; }
  .game-panel { padding: 22px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .score-display { display: grid; gap: 10px; margin-bottom: 22px; }
  .score-item { padding: 13px 14px; border: 1px solid rgba(255,255,255,.07); border-radius: 12px; background: rgba(255,255,255,.025); }
  .score-item span:first-child { display: block; color: var(--muted); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; }
  .score-item strong { display: block; margin-top: 3px; color: var(--ink); font-size: 1.45rem; }
  .game-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .game-controls button { min-height: 48px; border: 1px solid rgba(255,255,255,.11); border-radius: 12px; color: var(--ink); background: rgba(255,255,255,.05); cursor: pointer; }
  .game-controls button:hover { border-color: var(--accent); background: rgba(186,255,74,.08); }
  .game-controls .up { grid-column: 2; }
  .game-controls .left { grid-column: 1; }
  .game-controls .down { grid-column: 2; }
  .game-controls .right { grid-column: 3; }
  .game-controls .restart { grid-column: 1 / -1; color: var(--muted); }
  .game-hint { margin: 18px 0 0; color: var(--muted); font-size: .8rem; text-align: center; }
  .game-complete-actions { display: grid; gap: 8px; margin-top: 16px; }
  .game-complete-actions[hidden] { display: none; }
  .route-journal { display: grid; gap: 7px; color: var(--muted); font-size: .8rem; }
  .route-journal > strong, .route-journal label { color: var(--ink); text-align: left; }
  .route-journal textarea { width: 100%; min-height: 64px; resize: vertical; padding: 9px 10px; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; color: var(--ink); background: rgba(255,255,255,.04); }
  .route-journal textarea:focus-visible { outline: 3px solid rgba(186,255,74,.45); outline-offset: 2px; }
  .route-journal small { text-align: left; line-height: 1.45; }
  .strategy-feedback-card { margin-top: 14px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: rgba(255,255,255,.03); }
  @media (max-width: 860px) { .game-shell { grid-template-columns: 1fr; } .game-panel { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; } .score-display { margin: 0; } .inventory { margin: 0; padding: 0 0 0 18px; border-top: 0; border-left: 1px solid rgba(255,255,255,.08); } }
  @media (max-width: 720px) { .game-panel { grid-template-columns: 1fr 1fr; } .inventory { grid-column: 1 / -1; padding: 18px 0 0; border-top: 1px solid rgba(255,255,255,.08); border-left: 0; } }
  @media (max-width: 560px) {
    .game-header { align-items: flex-start; flex-direction: column; }
    .game-panel { grid-template-columns: 1fr; padding: 16px; }
    .score-display { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .score-item { padding: 10px 8px; }
    .score-item span:first-child { font-size: .65rem; letter-spacing: .03em; }
    .score-item strong { font-size: 1.2rem; }
    .inventory { grid-column: auto; }
  }
</style>
