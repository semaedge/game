<div
  class="game-canvas-shell"
  id="gameCanvasShell"
  aria-busy="true"
  aria-describedby="gameCanvasHelp gameCanvasStatus"
>
  <canvas
    id="gameCanvas"
    tabindex="0"
    role="img"
    aria-label="Tabuleiro interativo do Sema Edge"
  >
    Seu navegador não oferece suporte ao tabuleiro. Atualize-o para jogar.
  </canvas>
  <p class="sr-only" id="gameCanvasHelp">
    Use as setas ou as teclas W, A, S e D para mover o explorador.
  </p>
  <p class="game-canvas-status" id="gameCanvasStatus" role="status" aria-live="polite">
    Preparando o mapa…
  </p>
</div>
