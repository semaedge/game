<section class="game-scene" data-game-scene aria-label="Cenário inicial do jogo">
  <div class="game-scene__world" tabindex="0" role="application" aria-label="Use as setas ou WASD para mover o avatar">
    <img class="game-scene__map" data-asset-file="sema_edge_map.svg" alt="Mapa de paisagens de Sema Edge" hidden>
    <div class="game-scene__avatar" role="img" data-asset-file="sema_avatar.png" aria-label="Sema, avatar do jogador"></div>
    <p class="game-scene__hint">Explore com <kbd>← ↑ ↓ →</kbd> ou <kbd>WASD</kbd></p>
  </div>
  <p class="game-scene__status" role="status" aria-live="polite"></p>
</section>
<style>
  .game-scene{margin:0 0 1rem}.game-scene__world{position:relative;min-height:170px;aspect-ratio:9/5;max-height:320px;overflow:hidden;border:2px solid #2e7d5b;border-radius:14px;background:linear-gradient(135deg,#c9edd8,#7bc9d0);outline-offset:3px}.game-scene__map{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.game-scene__avatar{position:absolute;left:50%;top:50%;width:42px;height:42px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid #fff;background:#285c48 center/contain no-repeat;box-shadow:0 2px 8px #1238;z-index:1}.game-scene__hint{position:absolute;right:.5rem;bottom:.35rem;z-index:2;margin:0;padding:.25rem .45rem;border-radius:5px;background:#ffffffe6;color:#173a2e;font:600 .75rem system-ui}.game-scene kbd{padding:0 .18rem;border:1px solid #97a69f;border-radius:3px;background:#fff}
  .game-scene [hidden]{display:none!important}.game-scene__status{margin:.4rem 0;color:inherit;font:.8rem system-ui}.game-scene__status:empty{display:none}
</style>
<script>
(function () {
  var scene = document.currentScript.previousElementSibling.previousElementSibling;
  var world = scene.querySelector('.game-scene__world'), map = scene.querySelector('.game-scene__map'), avatar = scene.querySelector('.game-scene__avatar');
  var status = scene.querySelector('.game-scene__status');
  var pos = { x: 50, y: 50 }, step = 7;
  function render() { avatar.style.left = pos.x + '%'; avatar.style.top = pos.y + '%'; }
  function move(key) {
    var delta = {ArrowLeft:[-step,0],a:[-step,0],A:[-step,0],ArrowRight:[step,0],d:[step,0],D:[step,0],ArrowUp:[0,-step],w:[0,-step],W:[0,-step],ArrowDown:[0,step],s:[0,step],S:[0,step]}[key];
    if (!delta) return false;
    pos.x = Math.max(4, Math.min(96, pos.x + delta[0])); pos.y = Math.max(13, Math.min(87, pos.y + delta[1])); render(); return true;
  }
  if (window.__gameSceneKeyController) window.__gameSceneKeyController.abort();
  window.__gameSceneKeyController = new AbortController();
  var keyOptions = { signal: window.__gameSceneKeyController.signal };
  world.addEventListener('keydown', function (event) { if (move(event.key)) event.preventDefault(); }, keyOptions);
  // A prévia só recebe teclas quando tem foco; o tabuleiro possui seus próprios controles.
  function applyAssetManifest(manifest) {
    manifest = manifest || {};
    // O papel visual é declarado no HTML; a ordem recebida do servidor não o altera.
    var names = [map.dataset.assetFile, avatar.dataset.assetFile];
    var assets = manifest.assets || {};
    var missing = names.filter(function(name) {
      return !assets[name] || (manifest.missingRequiredFiles || []).indexOf(name) >= 0;
    });
    var loaded = {}, failed = {};
    world.dataset.assetsReady = 'false';
    world.dataset.assetProject = manifest.project || '';
    map.hidden = true;
    avatar.style.backgroundImage = '';
    function updateState() {
      var unavailable = missing.concat(Object.keys(failed));
      var ready = names.every(function(name) { return loaded[name]; }) && !unavailable.length && manifest.ok !== false;
      world.dataset.assetsReady = ready ? 'true' : 'false';
      status.textContent = unavailable.length || manifest.error
        ? 'Imagens indisponíveis. Verifique FOLDER_ID e os arquivos: ' + names.filter(function(name) { return !loaded[name]; }).join(', ') + '.'
        : (ready ? '' : 'Carregando imagens do Drive…');
    }
    function imageUrl(value) {
      try {
        var url = new URL(String(value || ''), window.location.href);
        if (url.protocol === 'https:' || (url.origin === window.location.origin && /^(localhost|127\.0\.0\.1)$/.test(url.hostname))) return url.href;
      } catch (_) {}
      return '';
    }
    names.forEach(function(name, index) {
      var url = imageUrl(assets[name]);
      if (!url || missing.indexOf(name) >= 0) { failed[name] = true; return; }
      var img = index === 0 ? map : new Image();
      var settled = false;
      var timeout = setTimeout(function() { finish(false); }, 12000);
      function finish(ok) {
        if (settled) return;
        settled = true;
        clearTimeout(timeout);
        if (ok) {
          loaded[name] = true;
          if (index === 0) map.hidden = false;
          else avatar.style.backgroundImage = 'url("' + url + '")';
        } else {
          failed[name] = true;
          if (index === 0) map.hidden = true;
        }
        updateState();
      }
      img.onload = function() { finish(Boolean(img.naturalWidth)); };
      img.onerror = function() { finish(false); };
      img.src = url;
    });
    updateState();
    window.__gameAssetManifest = manifest;
    window.dispatchEvent(new CustomEvent('gameassetsready', { detail: manifest }));
  }
  function loadAssetManifest() {
    if (!window.SemaAPI || typeof window.SemaAPI.call !== 'function') {
      world.dataset.assetsReady = 'false';
      status.textContent = 'Prévia visual indisponível. O tabuleiro principal continua disponível.';
      return;
    }
    window.SemaAPI.call('game.assets', {}, { redirectOnAuth: false })
      .then(function (response) {
        applyAssetManifest(response.data || {});
      })
      .catch(function () {
        world.dataset.assetsReady = 'false';
        status.textContent = 'Não foi possível carregar as imagens. Verifique o acesso à pasta do jogo.';
        world.setAttribute('aria-label', 'Cenário local pronto; os assets do Drive não puderam ser carregados');
      });
  }
  // GameScene é incluído antes dos scripts globais; aguarde o DOM para que
  // SemaAPI já esteja disponível e para evitar uma rota RPC paralela.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadAssetManifest, { once: true });
  } else {
    loadAssetManifest();
  }
  render();
})();
</script>
